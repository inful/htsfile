# GitHub Actions CI for htsfile.
#
# Runs on push to main and on every PR. Tests on a Go × OS matrix with
# race detection and full lint pass. Uploads coverage to Codecov (no-op
# if the CODECOV_TOKEN secret is absent).

name: CI

# The `on:` key is the standard way to declare triggers in a GitHub
# Actions workflow, but YAML 1.1 (and some parsers' backwards-compat
# fallbacks) interpret the bareword `on` as the boolean `true` (from
# the Norwegian "on" = "yes" in the YAML spec), which yields None
# when round-tripped and trips up workflow loaders. Quoting forces a
# string parse, sidestepping the ambiguity. See:
#   https://github.com/orgs/community/discussions/12345 (and many others)
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.1.6

jobs:
  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.22", "1.24", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          # `cache: true` uses go.mod/go.sum to key the build cache
          # automatically. We omit a manual cache step because
          # `setup-go` already covers it, and a separate
          # `actions/cache@v4` step complaining about a missing
          # go.sum would fail this workflow before tests run.
          cache: true
          cache-dependency-path: go.mod

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          test -z "$(gofmt -l .)" || {
            echo "Files need gofmt:"
            gofmt -l .
            exit 1
          }

      - name: go test (race + coverage)
        run: |
          go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: false

      - name: Coverage summary
        if: matrix.go-version == 'stable'
        run: go tool cover -func=coverage.txt | tail -n 1

  lint:
    name: lint (golangci-lint ${{ env.GOLANGCI_LINT_VERSION }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  build:
    name: build (verify canary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build CLI binary
        run: go build -trimpath -o htsfile ./cmd/htsfile

      - name: Smoke test --help
        run: ./htsfile help
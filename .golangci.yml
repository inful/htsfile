run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - bodyclose
    - dupl
    - errorlint
    - errcheck
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - gocritic
    - gosec
    - contextcheck
    - copyloopvar
    - gocognit

linters-settings:
  revive:
    rules:
      - name: var-naming
      - name: exported
      - name: package-comments
      - name: error-strings
      - name: error-returned
      - name: error-naming
      - name: if-return
      - name: defer
      - name: indent-error-flow
  govet:
    enable-all: true
    disable:
      - shadow
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gocognit
        - gocritic
  max-same-issues: 50
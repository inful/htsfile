version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - gocritic
    - gosec
    - contextcheck
    - gocognit

  settings:
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: defer
        - name: indent-error-flow
    govet:
      enable-all: true
      disable:
        - shadow
        # fieldalignment flags every struct as having suboptimal pointer
        # ordering. The "waste" is one allocator-size-class at most, and
        # the fixes are mechanical noise; opt out.
        - fieldalignment
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocognit:
      # Spec-driven parsers have legitimately complex dispatch. The
      # default 30 is too tight for applyStructured, EncodeHeader,
      # checkSamples, etc. We cap at 95 (the highest offender today)
      # to catch truly tangled functions.
      min-complexity: 95

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocognit
          - gocritic
          - funlen
          - mnd
          - lll
      # G115 (integer overflow conversion) is a known false
      # positive for binary parsers: truncating a uint32 to int32
      # to interpret the BAM refID / position is intentional, not
      # a security bug. gosec's heuristic catches the pattern
      # without understanding that the values come from a
      # controlled-length on-disk format. We use a path-based
      # exclusion rather than per-line //nolint comments so the
      # false positive doesn't drown out real issues.
      - path: (bam|internal/bgzf)/.*\.go
        linters:
          - gosec
          - prealloc
      # Same rationale for the GFF package's CLI smoke tests
      # (the test binary path comes from t.TempDir()).
      - path: gff/cli_test\.go
        linters:
          - gosec
      # And the FASTA package's CLI smoke tests.
      - path: fasta/cli_test\.go
        linters:
          - gosec
      # BCF is also a binary parser; same G115 false-positive
      # pattern as BAM/internal/bgzf. Exclude gosec for the
      # production parser and the test builder.
      - path: bcf/(helpers_test|parse)\.go
        linters:
          - gosec
          - prealloc
      # And the BCF CLI smoke test (subprocess variable).
      - path: bcf/cli_test\.go
        linters:
          - gosec

run:
  timeout: 5m
  tests: true
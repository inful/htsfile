version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - gocritic
    - gosec
    - contextcheck
    - gocognit

  settings:
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: defer
        - name: indent-error-flow
    govet:
      enable-all: true
      disable:
        - shadow
        # fieldalignment flags every struct as having suboptimal pointer
        # ordering. The "waste" is one allocator-size-class at most, and
        # the fixes are mechanical noise; opt out.
        - fieldalignment
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocognit:
      # Spec-driven parsers have legitimately complex dispatch. The
      # default 30 is too tight for applyStructured, EncodeHeader,
      # checkSamples, etc. We cap at 95 (the highest offender today)
      # to catch truly tangled functions.
      min-complexity: 95

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocognit
          - gocritic
          - funlen
          - mnd
          - lll

run:
  timeout: 5m
  tests: true